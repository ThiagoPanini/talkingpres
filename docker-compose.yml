services:
  web:
    build:
      # Contexto na raiz do monorepo para o build enxergar content/ (ADR-0001).
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      ETHITORIAL_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    environment:
      # Sem esta linha o container sobe com a url de exemplo do alembic.ini
      # (`@localhost`), que dentro do container é o próprio container: o
      # `alembic upgrade head` do CMD não acha banco nenhum e o serviço morre
      # antes de servir. O host é o nome do serviço, e as credenciais são as
      # declaradas em `postgres` logo abaixo.
      DATABASE_URL: postgresql+asyncpg://ethitorial:ethitorial@postgres:5432/ethitorial
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ethitorial
      POSTGRES_PASSWORD: ethitorial
      POSTGRES_DB: ethitorial
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ethitorial -d ethitorial"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
